name: Build TVAtlas Playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python scripts/build.py

      - name: Commit generated playlist
        run: |
          git config user.name "TVAtlas Bot"
          git config user.email "actions@github.com"
          git add tvatlas.m3u
          git diff --cached --quiet || git commit -m "Build Chinese UTF-8 playlist"
          git push
