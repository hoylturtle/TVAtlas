name: Build TVAtlas Playlist

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python scripts/build.py

      - name: Commit generated playlist
        run: |
          git config user.name "TVAtlas Bot"
          git config user.email "actions@github.com"

          git add tvatlas.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update TVAtlas playlist"
            git push
          fi
