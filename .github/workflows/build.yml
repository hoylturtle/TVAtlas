name: Build TVAtlas Playlist
# trigger: 2026-10-08 structural-validation-retry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: tvatlas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python scripts/build.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvatlas-diagnostics-${{ github.run_number }}
          path: tvatlas-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated playlist
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "TVAtlas Bot"
          git config user.email "actions@github.com"

          git add tvatlas.m3u tvatlas-orange.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update TVAtlas playlist"
            git push
          fi
