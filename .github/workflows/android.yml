name: Android Player
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-player/**', '.github/workflows/android.yml']
  push:
    branches: [main, feature/tvatlas-android-player, 'codex/tvatlas-player-*']
    paths: ['android-player/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      signed: ${{ steps.signing.outputs.signed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed release signing identity
        id: signing
        env:
          TVATLAS_SIGNING_BUNDLE: ${{ secrets.TVATLAS_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py
      - name: Bundle checksum-verified Mihomo Android cores
        run: python3 scripts/fetch_mihomo.py
      - name: Validate release publication without network writes
        run: python3 scripts/test_publish_release.py
      - run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Verify package version and APK signature
        id: package
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            python3 scripts/verify_apk.py
          else
            python3 scripts/verify_apk.py --unsigned-input
          fi
      - name: Package Mihomo corresponding source and notices
        run: python3 scripts/fetch_mihomo.py --source
      - name: Show lint findings on failure
        if: failure()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android-player/core/build/reports/tests/
            android-player/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: android-player/dist/
          if-no-files-found: error
      - name: Remove private release key
        if: always()
        run: rm -rf "$RUNNER_TEMP/tvatlas-signing"
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 scripts/fetch_mihomo.py
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-player
          script: |
            adb shell wm size 1280x960
            adb shell wm density 160
            bash -c 'gradle :app:connectedDebugAndroidTest --stacktrace; result=$?; adb pull /sdcard/Pictures/TVAtlas app/build/ui-previews; exit "$result"'
            adb pull /sdcard/Pictures/TVAtlas/tv-layout.png app/build/reports/androidTests/tv-layout.png
            adb pull /sdcard/Pictures/TVAtlas/phone-proxy-layout.png app/build/reports/androidTests/phone-proxy-layout.png
            adb pull /sdcard/Pictures/TVAtlas/phone-settings-layout.png app/build/reports/androidTests/phone-settings-layout.png
            adb pull /sdcard/Pictures/TVAtlas/phone-recovery-layout.png app/build/reports/androidTests/phone-recovery-layout.png
            adb pull /sdcard/Pictures/TVAtlas/fullscreen-layout.png app/build/reports/androidTests/fullscreen-layout.png
            adb pull /sdcard/Pictures/TVAtlas/fullscreen-stopped-layout.png app/build/reports/androidTests/fullscreen-stopped-layout.png
            adb pull /sdcard/Pictures/TVAtlas/mobile-failure-layout.png app/build/reports/androidTests/mobile-failure-layout.png
            python3 scripts/verify_upgrade_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: android-player/app/build/ui-previews/**/*.png
          if-no-files-found: warn
      - name: Show native test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'), failure.text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-core-test-results
          path: |
            android-player/app/build/reports/androidTests/
            !android-player/app/build/reports/androidTests/**/*.png
  publish-release:
    needs: [verify, native-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: android-player/dist/
      - name: Publish verified APK and update manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 android-player/scripts/publish_release.py
