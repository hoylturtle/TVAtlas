name: Android Player
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-player/**', '.github/workflows/android.yml']
  push:
    branches: [main, feature/tvatlas-android-player, 'codex/tvatlas-player-*']
    paths: ['android-player/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android-player/core/build/reports/tests/
            android-player/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: TVAtlas-Player-v0.1.0-debug
          path: android-player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
