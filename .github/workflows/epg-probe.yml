name: Probe public EPG sources
on:
  push:
    branches: [codex/tvatlas-player-feature-expansion]
    paths: [.github/workflows/epg-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public programme schema and availability
        run: python3 android-player/scripts/probe_epg.py
