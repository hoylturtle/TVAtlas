name: TVAtlas Next Preview
on:
  workflow_dispatch:
  push:
    branches: ['feature/tvatlas-next-*']
    paths: ['android-player/**', '.github/workflows/preview.yml']
permissions:
  contents: read
concurrency:
  group: next-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore fixed preview signing identity
        id: signing
        env:
          TVATLAS_SIGNING_BUNDLE: ${{ secrets.TVATLAS_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py
      - name: Require stable preview signing
        if: steps.signing.outputs.signed != 'true'
        run: exit 1
      - run: python3 scripts/fetch_mihomo.py
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-player
          script: |
            adb shell wm size 1280x960
            adb shell wm density 160
            gradle -PtvatlasTestBuildType=preview :core:test :app:testPreviewUnitTest :app:lintPreview :app:assemblePreview :app:connectedPreviewAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tvatlas.player.ui.CloudLibraryPageTest,com.tvatlas.player.ui.PreviewVodPlayerTest --stacktrace
            adb pull /sdcard/Pictures/TVAtlas-next app/build/next-ui-previews
      - uses: actions/upload-artifact@v4
        with:
          name: next-preview-ui
          path: android-player/app/build/next-ui-previews/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: TVAtlas-next-preview
          path: android-player/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/tvatlas-signing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-preview-tests
          path: |
            android-player/core/build/reports/tests/
            android-player/app/build/reports/
